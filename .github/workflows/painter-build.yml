name: Painter GIMP build

on:
  push:
    branches: [gimp-3-0-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux GIMP compile and link
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Bootstrap build tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates git python3 build-essential pkg-config \
            debian-archive-keyring glib-networking librsvg2-common libblas3 liblapack3
      - name: Fetch exact source and pinned data
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          source=$(mktemp -d "$RUNNER_TEMP/painter-build.XXXXXXXX")
          git -C "$source" init
          git -C "$source" remote add origin https://github.com/seagetch/gimp-painter.git
          git -C "$source" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$source" -c submodule.gimp-data.url=https://github.com/GNOME/gimp-data.git \
            submodule update --init --depth=1 gimp-data
          test "$(git -C "$source/gimp-data" rev-parse HEAD)" = \
            "$(git -C "$source" rev-parse HEAD:gimp-data)"
          printf 'PAINTER_BUILD_SOURCE=%s\n' "$source" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/build-results"
          git -C "$source" rev-parse HEAD > "$GITHUB_WORKSPACE/build-results/commit.txt"
      - name: Configure and compile GIMP
        run: |
          set -euo pipefail
          cd "$PAINTER_BUILD_SOURCE"
          out="$GITHUB_WORKSPACE/build-results"
          export GIMP_DEPS_DIRECTORY="$RUNNER_TEMP/painter-build-deps"
          export GIMP_BUILD_PREFIX="$RUNNER_TEMP/painter-build-prefix"
          python3 -B tools/prepare-linux-build-deps.py --directory "$GIMP_DEPS_DIRECTORY" \
            2>&1 | tee "$out/dependencies.log"
          source tools/linux-debian13-env.sh
          export CCACHE_DISABLE=1
          build="$RUNNER_TEMP/painter-gimp-build"
          meson setup "$build" . --prefix="$GIMP_BUILD_PREFIX" \
            --buildtype=debugoptimized -Dauto_features=disabled -Dlibunwind=false \
            -Dheadless-tests=disabled -Dpainter-http=disabled \
            -Denable-console-bin=false -Dgi-docgen=disabled -Dappdata-test=disabled \
            -Djavascript=disabled -Dvala=disabled -Dprint=false -Dcheck-update=no \
            -Dlibbacktrace=false 2>&1 | tee "$out/configure.log"
          # Normal Meson build, including the application and enabled plug-ins.
          # Do not run meson test, UI drivers, sanitizer proofs or runtime seals.
          meson compile -C "$build" -j 2 2>&1 | tee "$out/compile.log"
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: painter-build-${{ github.sha }}-${{ github.run_attempt }}
          path: build-results/
          if-no-files-found: warn
          retention-days: 7
